name: Product Hunt launch visual QA

on:
  workflow_dispatch:
    inputs:
      launch_url:
        description: "Lattice public launch URL (production or project Preview)"
        required: true
        type: string
        default: "https://gen1e.xyz/en/launch"

permissions:
  contents: read

jobs:
  launch-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 11.6.0 }
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify URL boundary and report logic
        run: node --test scripts/launch/qa-policy.test.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run public launch QA (no customer authentication)
        env:
          LATTICE_LAUNCH_URL: ${{ inputs.launch_url }}
        run: node scripts/launch/qa.mjs --url "$LATTICE_LAUNCH_URL" --out launch-qa-artifacts
      - name: Upload public-page screenshots and report only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launch-public-qa
          path: launch-qa-artifacts/
          retention-days: 7
          if-no-files-found: warn
