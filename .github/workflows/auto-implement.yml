name: Auto-Implementation

on:
  workflow_run:
    workflows: ["CodiumAI PR-Agent", "Genie AI PR Review"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-implement:
    name: 🤖 Apply Safe Suggestions
    runs-on: ubuntu-latest
    # Security: only run on non-fork PRs to prevent secret exfiltration
    # (CodeQL alert #1, #97: actions/untrusted-checkout)
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.fork == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          # Security: do not persist credentials to prevent exfiltration via
          # untrusted code that may be checked out from a PR branch.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check RAG Budget
        id: budget
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npx tsx scripts/check-rag-budget.ts || exit 0
          echo "budget_ok=true" >> $GITHUB_OUTPUT

      - name: Extract PR Suggestions
        if: steps.budget.outputs.budget_ok == 'true'
        id: extract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env (not ${{ }} interpolation) to prevent shell injection
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # HEAD_BRANCH comes from env var — safe from injection
          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --json number -q '.[0].number')
          
          # Sanitize PR_NUMBER to ensure it only contains digits (strip newlines/whitespace)
          PR_NUMBER=$(echo "$PR_NUMBER" | tr -cd '0-9')
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "Could not find open PR for branch $HEAD_BRANCH"
            exit 0
          fi
          
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          
          # Get review comments from Qodo/Genie
          gh pr view $PR_NUMBER --json reviewDecision,reviews -q '.reviews' > reviews.json
          
          # Extract suggestions (placeholder - in reality would parse review comments)
          echo "[]" > suggestions.json

      - name: Classify and Apply Suggestions
        if: steps.extract.outputs.pr_number != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Run auto-implementation with dry-run first
          npx tsx -e "
            import { autoImplementSafeSuggestions } from './lib/rag/autoImplementer';
            import suggestions from './suggestions.json';
            
            async function main() {
              const result = await autoImplementSafeSuggestions(suggestions, '.', true);
              console.log(result.summary);
            }
            
            main();
          " || echo "No suggestions to apply"

      - name: Commit Applied Changes
        if: steps.extract.outputs.pr_number != ''
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          git config user.name "Genie Auto-Implementer"
          git config user.email "genie@gen1e.xyz"
          
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit each changed file separately for easy rollback
          for file in $(git diff --name-only); do
            git add "$file"
            git commit -m "🤖 Auto-implement: $file" -m "Applied safe suggestion from PR review"
          done
          
          git pull --rebase origin "$HEAD_BRANCH"
          git push origin HEAD:refs/heads/$HEAD_BRANCH

      - name: Post Summary Comment
        if: steps.extract.outputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass via env to avoid ${{ }} shell injection
          PR_NUMBER: ${{ steps.extract.outputs.pr_number }}
        run: |
          cat << 'EOF' > comment.md
          ## 🤖 Auto-Implementation Complete
          
          Genie has automatically applied safe suggestions from the review.
          
          **Applied changes:**
          - See commits above
          
          **Rollback instructions:**
          ```bash
          git revert HEAD~<number_of_commits>
          ```
          EOF
          
          gh pr comment "$PR_NUMBER" --body-file comment.md || true


