name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Build Next.js app
        id: build_app
        env:
          GOOGLE_API_KEY: "dummy-key-for-build"
        run: pnpm install --no-frozen-lockfile && pnpm run build > build_logs.txt 2>&1 || { cat build_logs.txt; exit 1; }

      - name: Ingest CI Failure to UCOL Agent
        if: failure() && steps.build_app.outcome == 'failure'
        run: |
          ERROR_LOG=$(tail -n 100 build_logs.txt | jq -Rsa .)
          curl -s -X POST "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/logs" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer *** secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"level\":\"error\",\"source\":\"github_actions_ci\",\"resolution_status\":\"pending\",\"message\":$ERROR_LOG,\"metadata\":{\"run_id\":\"${{ github.run_id }}\",\"repo\":\"${{ github.repository }}\",\"branch\":\"${{ github.head_ref }}\"}}"
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENIE_AI_1CA85 }}
          projectId: genie-ai-1ca85


