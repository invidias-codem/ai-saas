name: CI

on:
  # Run on stacked feature PRs, not just PRs targeting main.
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-lint-test:
    name: Build, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 11.6.0 }

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Lean toolchain
        run: |
          curl -Proto '=https' --tlsv1.2 -sSf -L https://github.com/leanprover/elan/releases/download/v1.13.0/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz -C $HOME/.elan/bin --strip-components=1
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Build Workspace Packages
        run: pnpm --recursive --filter @lattice-os/core run build && pnpm --recursive --filter @lattice-os/mcp-remote run build

      - name: ONNX artifact integrity
        # Fails if any deployed .onnx's bytes disagree with its *_meta.json size_bytes.
        # See scripts/check-onnx-artifact-integrity.sh for the incident context.
        run: bash scripts/check-onnx-artifact-integrity.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # 6A.3: attest execution. --json gives real counts; the attestation
        # proves the suite RAN against this commit (zero tests = red flag).
        run: |
          npx jest --json --outputFile=.attestation-jest.json || TEST_FAILED=$?
          npx tsx scripts/attestation-cli.ts write \
            --suite decision-plane-contracts \
            --jest-json .attestation-jest.json \
            --out attestations/decision-plane-contracts.json
          cat attestations/decision-plane-contracts.json
          exit ${TEST_FAILED:-0}

      - name: Build
        run: pnpm build


