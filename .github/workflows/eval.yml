name: Eval (Regression Gate)

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            memory:
              - 'lib/memory/**'
            prompts:
              - 'prompts/**'
              - 'anycrawl/**/prompts/**'
              - 'lib/slack/**'
            conversation:
              - 'app/api/conversation/**'
              - 'lib/llm/**'

      - name: Skip if not relevant
        if: steps.changes.outputs.memory != 'true' && steps.changes.outputs.prompts != 'true' && steps.changes.outputs.conversation != 'true'
        run: |
          echo "No prompt/memory/llm changes detected; skipping eval."

      - name: Setup Node
        if: steps.changes.outputs.memory == 'true' || steps.changes.outputs.prompts == 'true' || steps.changes.outputs.conversation == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.memory == 'true' || steps.changes.outputs.prompts == 'true' || steps.changes.outputs.conversation == 'true'
        run: npm ci

      # Option 1: download curated dataset artifact from nightly workflow.
      # For now we re-run curation in the PR job for determinism.
      - name: Curate dataset (PR)
        if: steps.changes.outputs.memory == 'true' || steps.changes.outputs.prompts == 'true' || steps.changes.outputs.conversation == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run curate:dataset -- \
            --since-days 30 \
            --min-rating -1 \
            --max-rating -1 \
            --out datasets

      - name: Run eval (Mode B replay)
        if: steps.changes.outputs.memory == 'true' || steps.changes.outputs.prompts == 'true' || steps.changes.outputs.conversation == 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EVAL_USER_ID: "eval_user"
          DISABLE_SIDE_EFFECTS: "true"
          DISABLE_EXTERNAL_CONTEXT: "true"
        run: |
          DATASET_DIR=$(ls -1 datasets | head -n 1)
          npm run eval:run -- \
            --dataset "datasets/${DATASET_DIR}/dataset.jsonl" \
            --out eval \
            --disable-side-effects true \
            --disable-external-context true \
            --model gemini-2.0-flash

      - name: Compare to baseline
        if: steps.changes.outputs.memory == 'true' || steps.changes.outputs.prompts == 'true' || steps.changes.outputs.conversation == 'true'
        run: |
          npm run eval:compare -- --report eval/report.json --baseline eval/baseline.json

      - name: Upload eval artifacts
        if: always() && (steps.changes.outputs.memory == 'true' || steps.changes.outputs.prompts == 'true' || steps.changes.outputs.conversation == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            eval/**

      - name: Comment PR summary
        if: always() && github.event_name == 'pull_request' && (steps.changes.outputs.memory == 'true' || steps.changes.outputs.prompts == 'true' || steps.changes.outputs.conversation == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'eval/summary.md';
            const comparePath = 'eval/baseline_comparison.md';
            const summary = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : '# Eval Summary\n\n(summary missing)\n';
            const compare = fs.existsSync(comparePath) ? fs.readFileSync(comparePath, 'utf8') : '';
            const body = `${summary}\n---\n${compare}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
