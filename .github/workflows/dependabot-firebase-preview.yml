name: Firebase Preview (Dependabot)

# Uses pull_request_target so secrets are available even for Dependabot PRs.
# Security gate: job only runs when github.actor == 'dependabot[bot]'.
# The head SHA is explicitly pinned to prevent secret exfiltration from
# malicious code injected via the PR branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  dependabot-preview:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      # Step 1: Fetch Dependabot metadata — tells us what was bumped and how
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Step 2: Log what changed (useful for debugging + audit trail)
      - name: Log dependency info
        run: |
          echo "📦 Package(s): ${{ steps.metadata.outputs.dependency-names }}"
          echo "🔄 Update type: ${{ steps.metadata.outputs.update-type }}"
          echo "🏷️  Dependency type: ${{ steps.metadata.outputs.dependency-type }}"
          echo "🌐 Package ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"

      # Step 3: Checkout the PR branch at its exact SHA (security: explicit pin)
      # persist-credentials: false prevents the checked-out code from accessing
      # the GITHUB_TOKEN via git credentials (CodeQL alert #96: untrusted-checkout).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Next.js app
        env:
          GOOGLE_API_KEY: "dummy-key-for-build"
        run: npm install --legacy-peer-deps && npm run build

      # Step 4: Deploy Firebase preview — now works because pull_request_target has secrets
      - name: Deploy Firebase Preview
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENIE_AI_1CA85 }}
          projectId: genie-ai-1ca85
          expires: 7d

      # Step 5: Auto-approve patch and minor bumps — safe to merge without manual review
      - name: Auto-approve patch/minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Label major bumps for manual review — don't auto-approve breaking changes
      - name: Label major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label "major-bump,needs-review"
          gh pr comment "$PR_URL" --body "⚠️ **Major version bump detected** — \`${{ steps.metadata.outputs.dependency-names }}\` requires manual review before merge. Check for breaking changes."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}