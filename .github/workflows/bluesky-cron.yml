name: Bluesky Engagement Agent Cron

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping-bluesky:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Fetch the endpoint, failing the workflow if a non-200 HTTP code is returned
          curl -sS -w "\n%{http_code}" -X GET \
            "https://gen1e.xyz/api/cron/bluesky-engage" \
            -H "Authorization: Bearer ${CRON_SECRET}"

      - name: Trigger proactive post endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -w "\n%{http_code}" -X GET \
            "https://gen1e.xyz/api/cron/bluesky-post" \
            -H "Authorization: Bearer ${CRON_SECRET}"

      - name: Trigger discovery engagement endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -w "\n%{http_code}" -X GET \
            "https://gen1e.xyz/api/cron/bluesky-discover" \
            -H "Authorization: Bearer ${CRON_SECRET}"
