# ── Validate the Tauri native shell (Rust side) ────────────────────────────
# Compile-validates the src-tauri crate and clippy on every relevant change.
#
# Explicitly NOT validated here: the Next.js SaaS frontend as a static Tauri
# export. Lattice's current app has 25+ dynamic/API routes which Tauri's
# documented Next.js integration (output: 'export') does not support. That is
# a real desktop architecture decision tracked separately.

name: Validate Tauri Native Shell

on:
  push:
    branches: [ main ]
    paths:
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tauri.conf.json"
      - ".github/workflows/build-tauri.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tauri.conf.json"
      - ".github/workflows/build-tauri.yml"

concurrency:
  group: build-tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-tauri:
    name: Compile Tauri native shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            sidecar: lattice-harness-x86_64-unknown-linux-gnu
          - os: windows-latest
            sidecar: lattice-harness-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build lattice-harness sidecar
        # tauri.conf.json declares binaries/lattice-harness as externalBin.
        # Produce the current source for each platform's resource name.
        working-directory: go-harness
        run: go build -o "../src-tauri/binaries/${{ matrix.sidecar }}" ./cmd/lattice-harness

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lint (clippy) — src-tauri
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tauri host state and child monitor tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Compile Tauri native shell
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml


