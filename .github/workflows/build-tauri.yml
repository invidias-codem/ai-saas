# ── Validate the Tauri native shell (Rust side) ────────────────────────────
# Compile-validates the src-tauri crate and clippy on every relevant change.
#
# Explicitly NOT validated here: the Next.js SaaS frontend as a static Tauri
# export. Lattice's current app has 25+ dynamic/API routes which Tauri's
# documented Next.js integration (output: 'export') does not support. That is
# a real desktop architecture decision tracked separately.

name: Validate Tauri Native Shell

on:
  push:
    branches: [ main ]
    paths:
      - "src-tauri/**"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "desktop/**"
      - "scripts/desktop/**"
      - "scripts/native-host/webview-smoke.test.mjs"
      - "lib/harness/nativeWorkspace.ts"
      - "testdata/native-*.json"
      - "scripts/native-host/test-shell-windows.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tauri.conf.json"
      - ".github/workflows/build-tauri.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "desktop/**"
      - "scripts/desktop/**"
      - "scripts/native-host/webview-smoke.test.mjs"
      - "lib/harness/nativeWorkspace.ts"
      - "testdata/native-*.json"
      - "scripts/native-host/test-shell-windows.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tauri.conf.json"
      - ".github/workflows/build-tauri.yml"

concurrency:
  group: build-tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-tauri:
    name: Compile Tauri native shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            sidecar: lattice-harness-x86_64-unknown-linux-gnu
          - os: windows-latest
            sidecar: lattice-harness-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"

      - name: Build lattice-harness sidecar
        # tauri.conf.json declares binaries/lattice-harness as externalBin.
        # Produce the current source for each platform's resource name.
        working-directory: go-harness
        run: go build -o "../src-tauri/binaries/${{ matrix.sidecar }}" ./cmd/lattice-harness

      - name: Build the bundled desktop interface
        run: node scripts/desktop/build.mjs

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Rust lint (clippy) — src-tauri
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Tauri lifecycle and IPC permission tests (Linux)
        if: runner.os == 'Linux'
        env:
          LATTICE_TEST_DAEMON_PATH: ${{ github.workspace }}/src-tauri/binaries/${{ matrix.sidecar }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Tauri lifecycle and IPC permission tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LATTICE_TEST_DAEMON_PATH: ${{ github.workspace }}/src-tauri/binaries/${{ matrix.sidecar }}
        run: ./scripts/native-host/test-shell-windows.ps1

      - name: Compile Tauri native shell
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked

  webview-smoke-test:
    name: WebView smoke test (Linux)
    runs-on: ubuntu-22.04
    needs: build-tauri
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libasound2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.6.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "stable"

      - name: Build lattice-harness sidecar
        working-directory: go-harness
        run: go build -o "../src-tauri/binaries/lattice-harness-x86_64-unknown-linux-gnu" ./cmd/lattice-harness

      - name: Build the real app and bundled sidecar (release)
        run: pnpm exec tauri build --no-bundle --config src-tauri/tauri.preview.conf.json -- --locked

      - name: Install the native WebView driver
        run: cargo install tauri-driver --locked

      - name: Exercise authenticated status through real WebView IPC
        run: xvfb-run -a node --test scripts/native-host/webview-smoke.test.mjs

      - name: Preserve measured WebView evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-webview-smoke-${{ github.sha }}
          path: webview-smoke-results.json
          if-no-files-found: warn
