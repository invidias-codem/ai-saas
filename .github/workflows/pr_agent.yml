name: CodiumAI PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]
  
  # Trigger on comments for commands like /describe, /review, /ask
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR Agent
    steps:
      - name: PR Agent action
        id: pr_agent
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }} 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Point to our config file
          CONFIG.CONFIGURATION_PATH: ".pr_agent.toml"
          
          # Enable RAG features
          RAG_ARGUMENTS.ENABLE_RAG: "true"
          
          # Configuration
          PR_AGENT.TOOLS.COLLAPSIBLE_COMMENTS: true
          PR_AGENT.TOOLS.RUBRIC_SCORE: true
          PR_AGENT.TOOLS.SUGGESTIONS_SCORE_THRESHOLD: 0
