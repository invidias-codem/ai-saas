name: Blog Post Automation

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'content/blog/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    name: 📝 Validate & Auto-Merge Blog Post
    runs-on: ubuntu-latest
    # Only run for Genie-generated branches
    if: startsWith(github.head_ref, 'genie/')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Changed Blog Files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep 'content/blog/' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          if [ -z "$FILES" ]; then
            echo "No blog files changed"
            echo "has_blog_files=false" >> $GITHUB_OUTPUT
          else
            echo "Blog files changed:"
            echo "$FILES"
            echo "has_blog_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate Frontmatter
        if: steps.changed.outputs.has_blog_files == 'true'
        run: |
          echo "🔍 Validating blog post frontmatter..."
          
          FAILED=false
          
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            
            echo ""
            echo "📄 Checking: $file"
            
            # Extract frontmatter (between --- markers)
            FRONTMATTER=$(sed -n '/^---$/,/^---$/p' "$file" | head -n -1 | tail -n +2)
            
            if [ -z "$FRONTMATTER" ]; then
              echo "  ❌ No frontmatter found"
              FAILED=true
              continue
            fi
            
            # Check for date or publishedAt
            if ! echo "$FRONTMATTER" | grep -qE '^(date|publishedAt):'; then
              echo "  ❌ Missing date/publishedAt field"
              FAILED=true
            else
              # Validate date format (YYYY-MM-DD)
              DATE_LINE=$(echo "$FRONTMATTER" | grep -E '^(date|publishedAt):' | head -1)
              if ! echo "$DATE_LINE" | grep -qE '20[0-9]{2}-[0-1][0-9]-[0-3][0-9]'; then
                echo "  ❌ Invalid date format (expected YYYY-MM-DD): $DATE_LINE"
                FAILED=true
              else
                echo "  ✅ Valid date"
              fi
            fi
            
            # Check for title
            if ! echo "$FRONTMATTER" | grep -qE '^title:'; then
              echo "  ❌ Missing title field"
              FAILED=true
            else
              echo "  ✅ Has title"
            fi
            
            # Check for description
            if ! echo "$FRONTMATTER" | grep -qE '^description:'; then
              echo "  ❌ Missing description field"
              FAILED=true
            else
              echo "  ✅ Has description"
            fi
            
          done <<< "${{ steps.changed.outputs.files }}"
          
          if [ "$FAILED" = true ]; then
            echo ""
            echo "❌ Frontmatter validation failed"
            exit 1
          fi
          
          echo ""
          echo "✅ All blog posts validated successfully!"

      - name: Enable Auto-Merge
        if: success() && steps.changed.outputs.has_blog_files == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Enabling auto-merge for PR #${{ github.event.pull_request.number }}..."
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto
          echo "✅ Auto-merge enabled! PR will merge when all checks pass."

      - name: Post Summary
        if: always()
        run: |
          echo "## 📝 Blog Post Automation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files validated**: ${{ steps.changed.outputs.has_blog_files }}" >> $GITHUB_STEP_SUMMARY
