name: Security Tests

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'app/api/**'
      - 'lib/security/**'
      - '__tests__/security/**'
      - '__tests__/readiness/**'
      - '.github/workflows/security-tests.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/api/**'
      - 'lib/security/**'
      - '__tests__/security/**'
      - '__tests__/readiness/**'
      - '.github/workflows/security-tests.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read        # read-only — security tests never push
  issues: write         # needed to post failure comments on PRs
  pull-requests: write  # needed to post review comments

jobs:
  security-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run security unit tests
        run: pnpm run test:security:unit
        env:
          NODE_ENV: test
      
      - name: Run security integration tests
        run: pnpm run test:security:integration
        env:
          NODE_ENV: test
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      
      - name: Check TypeScript compilation
        run: npx tsc --noEmit --skipLibCheck
      
      - name: Run ESLint
        run: pnpm run lint
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 30
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Security tests failed. Please review the test results and fix any issues before merging.'
            })

  build-verification:
    runs-on: ubuntu-latest
    needs: security-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Remove broken Python venv symlinks
        run: find . -path ./node_modules -prune -o -type l -print | xargs -I{} sh -c 'test -e "{}" || rm -f "{}"' 2>/dev/null; true

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_dummy' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'dummy_key' }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: .next/
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for known vulnerabilities
        id: audit_check
        run: |
          if pnpm audit --audit-level=high --json > audit-results.json; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "✅ No high severity vulnerabilities found"
          else
            echo "status=warn" >> "$GITHUB_OUTPUT"
            echo "⚠️ High severity vulnerabilities detected"
            cat audit-results.json
          fi
        continue-on-error: true

      - name: Summarize audit findings
        if: always()
        run: |
          echo "## Security audit" >> "$GITHUB_STEP_SUMMARY"
          if [ -f audit-results.json ]; then
            node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('audit-results.json','utf8')); const vulns=Object.entries(data.vulnerabilities || {}).filter(([_,v]) => ['high','critical'].includes(v.severity)).map(([name,v]) => '- ' + name + ': ' + v.severity); if (vulns.length === 0) { console.log('No high/critical vulnerabilities detected.'); } else { console.log('High/critical vulnerabilities still present:'); for (const line of vulns) console.log(line); }" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No audit-results.json produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit
          path: audit-results.json
          retention-days: 30
