name: Security Tests

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'app/api/**'
      - 'lib/security/**'
      - '__tests__/security/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/api/**'
      - 'lib/security/**'
      - '__tests__/security/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read        # read-only — security tests never push
  issues: write         # needed to post failure comments on PRs
  pull-requests: write  # needed to post review comments

jobs:
  security-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run security unit tests
        run: npm run test:security:unit
        env:
          NODE_ENV: test
      
      - name: Run security integration tests
        run: npm run test:security:integration
        env:
          NODE_ENV: test
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      
      - name: Check TypeScript compilation
        run: npx tsc --noEmit --skipLibCheck
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 30
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Security tests failed. Please review the test results and fix any issues before merging.'
            })

  build-verification:
    runs-on: ubuntu-latest
    needs: security-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Remove broken Python venv symlinks
        run: find . -path ./node_modules -prune -o -type l -print | xargs -I{} sh -c 'test -e "{}" || rm -f "{}"' 2>/dev/null; true

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          # Add any required build-time environment variables
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_dummy' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'dummy_key' }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: .next/
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for known vulnerabilities
        run: |
          if npm audit --audit-level=high --json > audit-results.json; then
            echo "✅ No high severity vulnerabilities found"
          else
            echo "⚠️ High severity vulnerabilities detected"
            cat audit-results.json
            exit 1
          fi
      
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-audit
          path: audit-results.json
          retention-days: 30
