name: Installed UI regression diagnostics
on:
  pull_request:
    paths: ['scripts/desktop/**', '.github/workflows/desktop-qualification-debug.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-ui-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Baseline installer diagnostics (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Temporary diagnostics against the exact prior installer. The normal
      # package workflow still qualifies the current commit; this is not its gate.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 41192669681
          name: lattice-desktop-${{ matrix.platform }}-x64-d28af5231ca37fb0aeceb05d0510407f79ebccf2
          path: artifacts/${{ matrix.platform }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install Linux UI tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb xauth xdotool imagemagick dbus-x11 openbox python3-pyatspi at-spi2-core libatk-adaptor gsettings-desktop-schemas
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Diagnose Linux native UI
        if: runner.os == 'Linux'
        env:
          NO_AT_BRIDGE: '0'
        run: >-
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24'
          sh -c 'set -e; gsettings set org.gnome.desktop.interface toolkit-accessibility true; openbox >/dev/null 2>&1 & exec "$@"' lattice-ui
          node scripts/desktop/qualify-installed.mjs artifacts/linux d28af5231ca37fb0aeceb05d0510407f79ebccf2 desktop/evidence/linux ${{ github.sha }}
      - name: Diagnose Windows native UI
        if: runner.os == 'Windows'
        run: node scripts/desktop/qualify-installed.mjs artifacts/windows d28af5231ca37fb0aeceb05d0510407f79ebccf2 desktop/evidence/windows ${{ github.sha }}
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-regression-${{ matrix.platform }}-${{ github.sha }}
          path: desktop/evidence/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 7
