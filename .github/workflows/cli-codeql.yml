name: CLI release CodeQL
on:
  pull_request:
    paths:
      - 'scripts/lattice-cli/**'
      - 'lib/releases/**'
      - 'app/**/downloads/**'
      - 'components/landing/**'
      - 'proxy.ts'
      - '.github/workflows/cli-codeql.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lattice-cli/**'
      - 'lib/releases/**'
      - 'app/**/downloads/**'
      - 'components/landing/**'
      - 'proxy.ts'
      - '.github/workflows/cli-codeql.yml'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - scripts/lattice-cli
              - lib/releases
              - components/landing
              - app/**/downloads/**
              - proxy.ts
            paths-ignore:
              - '**/build/**'
              - '**/tests/**'
              - '**/*.test.ts'
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          category: '/cli-release/${{ matrix.language }}'
          output: codeql-results
      - name: Block high and critical security findings
        run: |
          python3 - <<'PY'
          import json, pathlib
          failures = []
          files = list(pathlib.Path('codeql-results').glob('*.sarif'))
          if not files:
              raise SystemExit('No CodeQL evidence produced')
          for path in files:
              for run in json.loads(path.read_text()).get('runs', []):
                  rules = {rule['id']: rule for rule in run['tool']['driver'].get('rules', [])}
                  for finding in run.get('results', []):
                      severity = float(rules.get(finding.get('ruleId'), {}).get('properties', {}).get('security-severity', 0))
                      if severity >= 7.0:
                          failures.append(finding['ruleId'])
          if failures:
              raise SystemExit('High/critical findings: ' + ', '.join(sorted(set(failures))))
          PY
