name: Desktop evaluation packages
on:
  pull_request:
    paths: ['desktop/**', 'scripts/desktop/**', 'src-tauri/**', 'go-harness/**', 'lib/harness/nativeWorkspace.ts', '.github/workflows/desktop-packages.yml', 'package.json', 'pnpm-lock.yaml']
  push:
    branches: [main]
    paths: ['desktop/**', 'scripts/desktop/**', 'src-tauri/**', 'go-harness/**', 'lib/harness/nativeWorkspace.ts', '.github/workflows/desktop-packages.yml', 'package.json', 'pnpm-lock.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-packages-${{ github.ref }}
  # Main builds remain available to testers. PR revisions replace outdated
  # qualification runs so fixes are checked against the current source.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    name: Evaluation installer (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: 'src-tauri -> target'
          key: preview-packages
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile
      - name: Check and bundle the desktop interface
        run: |
          pnpm desktop:check
          pnpm desktop:frontend
          pnpm desktop:sidecar
          node --test scripts/desktop/workspace.test.mjs
          node --test scripts/desktop/package-qualification.test.mjs
          node --test scripts/desktop/first-run-kit.test.mjs
          node --test scripts/desktop/webdriver-protocol.test.mjs
      - name: Test the native client and download release gates
        run: pnpm exec jest --runInBand lib/harness/nativeWorkspace.test.ts lib/releases/desktop.test.ts
      - name: Build evaluation installers with bundled service
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm exec tauri build --config src-tauri/tauri.preview.conf.json --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect fixed package names, source identity and checksums
        run: node scripts/desktop/collect-packages.mjs ${{ matrix.platform }} ${{ github.sha }}
      - name: Upload evaluation packages (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lattice-desktop-${{ matrix.platform }}-x64-${{ github.sha }}
          path: dist/desktop/${{ matrix.platform }}-x64/
          if-no-files-found: error
          retention-days: 14

  installed-qualification:
    name: Installed native UI (${{ matrix.platform }})
    needs: package
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          # This exercises installed WebView2 behavior on the recorded CI OS.
          # A Windows Server run does not claim manual Windows 11 qualification.
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lattice-desktop-${{ matrix.platform }}-x64-${{ github.sha }}
          path: artifacts/${{ matrix.platform }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install Linux native UI test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb xauth xdotool imagemagick dbus-x11 openbox python3-pyatspi at-spi2-core libatk-adaptor gsettings-desktop-schemas
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install the external native WebView driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Test installation and real native UI (Linux)
        if: runner.os == 'Linux'
        env:
          NO_AT_BRIDGE: '0'
        run: >-
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24'
          sh -c 'set -e; gsettings set org.gnome.desktop.interface toolkit-accessibility true; openbox >/dev/null 2>&1 & exec "$@"' lattice-ui
          node scripts/desktop/qualify-installed.mjs artifacts/linux ${{ github.sha }} desktop/evidence/linux
      - name: Test installation and real native UI (Windows)
        if: runner.os == 'Windows'
        run: node scripts/desktop/qualify-installed.mjs artifacts/windows ${{ github.sha }} desktop/evidence/windows
      - name: Preserve measured native UI and installed-package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-native-ui-${{ matrix.platform }}-${{ github.sha }}
          path: desktop/evidence/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 30

