name: Build lattice-cli
on:
  pull_request:
    paths:
      - 'scripts/lattice-cli/**'
      - '.github/workflows/build-lattice-cli.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact candidate tag matching the CLI version, e.g. cli-v0.3.1-rc.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cli-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: CLI ${{ matrix.target }}
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: macos-amd64, runner: macos-15-intel }
          - { target: macos-arm64, runner: macos-14 }
          - { target: windows-amd64, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r scripts/lattice-cli/requirements-build.lock
      - name: Unit and security regressions
        run: python -m unittest discover -s scripts/lattice-cli/tests -v
      - name: Build native executable
        run: python scripts/lattice-cli/build.py --pyinstaller
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
      - name: Smoke test the packaged executable
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
          PYTHONUTF8: '1'
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts/lattice-cli')
          from smoke_binary import smoke
          from lattice_cli import __version__
          target = os.environ['TARGET_PLATFORM']
          asset = 'lattice-' + target + ('.exe' if target.startswith('windows') else '')
          smoke(pathlib.Path('dist/cli') / asset)
          report = {'target': target, 'version': __version__, 'sourceCommit': os.environ['SOURCE_COMMIT'], 'passed': True}
          pathlib.Path(f'dist/cli/smoke-{target}.json').write_text(json.dumps(report))
          PY
      - name: Dependency vulnerability gate and CycloneDX SBOM
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r scripts/lattice-cli/requirements-build.lock --require-hashes --format cyclonedx-json --output "dist/cli/sbom-$TARGET_PLATFORM.json"
      - name: Upload only release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/cli/lattice-${{ matrix.target }}*
            dist/cli/smoke-${{ matrix.target }}.json
            dist/cli/sbom-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14
  release:
    name: Stage attested candidate release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    environment: cli-release
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - name: Validate version and aggregate release evidence
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/lattice-cli')
          from lattice_cli import __version__
          from release_manifest import generate
          if '-rc.' not in __version__ or os.environ['RELEASE_TAG'] != f'cli-v{__version__}':
              raise SystemExit('Only an exact, versioned release candidate can be staged')
          generate('dist/cli', os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'])
          PY
      - name: Attest all release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/cli/*'
      - name: Create a draft prerelease for operator verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/cli/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Lattice OS CLI $RELEASE_TAG" --notes-file docs/releases/cli-candidate-notes.md
