name: Promote Dataset to Golden

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'The dataset ID (e.g., feedback_dataset_10833de6d6be) to promote to Golden.'
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Dataset Exists
        run: |
          if [ ! -d "datasets/${{ github.event.inputs.dataset_id }}" ]; then
            echo "Error: Dataset datasets/${{ github.event.inputs.dataset_id }} does not exist."
            exit 1
          fi

      - name: Promote Dataset
        run: |
          mkdir -p datasets/golden
          cp datasets/${{ github.event.inputs.dataset_id }}/dataset.jsonl datasets/golden/dataset.jsonl
          cp datasets/${{ github.event.inputs.dataset_id }}/manifest.json datasets/golden/manifest.json || echo "No manifest.json to copy, skipping."
          
          echo "Promoted ${{ github.event.inputs.dataset_id }} to datasets/golden/dataset.jsonl"

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore(data): promote ${{ github.event.inputs.dataset_id }} to golden dataset"
          file_pattern: "datasets/golden/**"
