[[permission]]
identifier = "native-credentials"
description = "Local main-window credential storage, status and explicit endpoint configuration retrieval; no API-key or refresh-token readback."
commands.allow = ["credential_store_api_key", "credential_update_api_key", "credential_get_api_key_status", "credential_delete_api_key", "credential_list_provider_credentials", "credential_store_refresh_token", "credential_get_refresh_token_status", "credential_delete_refresh_token", "credential_store_local_endpoint", "credential_get_local_endpoint_status", "credential_get_local_endpoint", "credential_delete_local_endpoint"]

[[permission]]
identifier = "native-profiles"
description = "Local main-window profile configuration identified by channel and opaque profile ID; filesystem paths are derived in Rust."
commands.allow = ["resolve_native_paths", "load_profile_config", "save_profile_config", "list_profiles"]
