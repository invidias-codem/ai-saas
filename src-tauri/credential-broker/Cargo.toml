[package]
name = "lattice-credential-broker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tauri = { version = "2.11.2", features = ["api-ipc", "api-shell", "api-dialog"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
security-framework-sys = "2.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
secret-service = "5.2"
dbus = "0.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "net", "rt-multi-thread", "test-util"] }