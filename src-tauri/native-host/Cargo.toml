[package]
name = "lattice-native-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
getrandom = "0.2.16"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "net", "rt-multi-thread", "test-util"] }
