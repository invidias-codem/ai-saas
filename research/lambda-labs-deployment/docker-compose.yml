version: "3.9"

services:
  # 1. The LLM Server (vLLM for high-throughput, OpenAI-compatible API)
  llm-server:
    image: vllm/vllm-openai:latest
    container_name: genie-llm
    runtime: nvidia
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model "NousResearch/Hermes-3-Llama-3.1-8B" 
      --max-model-len 8192 
      --gpu-memory-utilization 0.90 
      --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped

  # 2. The Python Brain (vector-agent-python)
  vector-brain:
    build: 
      context: ../../functions/vector-agent-python
      dockerfile: Dockerfile
    container_name: genie-vector-brain
    environment:
      - LOCAL_LLM_URL=http://llm-server:8000/v1
      - LOCAL_LLM_MODEL=NousResearch/Hermes-3-Llama-3.1-8B
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - llm-server
    restart: unless-stopped
    volumes:
      - ../../functions/vector-agent-python:/app

  # 3. Secure Tunnel (Optional - Cloudflared for zero-trust exposure)
  # This makes the API available to Vercel without exposing a public IP/port directly
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: genie-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
