version: "3.9"

# ── Tech Genie — Vast.ai GPU Stack ────────────────────────────────────────────
# Instance: 4x RTX 2080 Ti | 88GB VRAM | nvidia/cuda_12.1.0-devel-ubuntu22.04
# Model: Qwen/Qwen3.5-35B-A3B (MoE — 35B params, 3B active, runs lean)
# Runner: Docker Model Runner (HF native, OpenAI-compatible API at :12434)
#
# Env vars required (fill in .env):
#   SUPABASE_URL              — https://ozevwhiipwbcvyzkbhib.supabase.co
#   SUPABASE_SERVICE_KEY      — Supabase service role key
#   CLOUDFLARE_TUNNEL_TOKEN   — Cloudflare Zero Trust tunnel token
# ──────────────────────────────────────────────────────────────────────────────

services:
  # 1. Docker Model Runner (HuggingFace native, OpenAI-compatible)
  #    Exposes: POST http://localhost:12434/engines/v1/chat/completions
  llm-server:
    image: docker/model-runner:latest
    container_name: genie-llm
    runtime: nvidia
    command: ["hf.co/Qwen/Qwen3.5-35B-A3B"]
    ports:
      - "127.0.0.1:12434:12434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - model-cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:12434/engines/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # 2. Python Brain (vector-agent — Supabase + knowledge graph)
  vector-brain:
    build:
      context: ../../functions/vector-agent-python
      dockerfile: Dockerfile
    container_name: genie-vector-brain
    environment:
      - LOCAL_LLM_URL=http://llm-server:12434/engines/v1
      - LOCAL_LLM_MODEL=hf.co/Qwen/Qwen3.5-35B-A3B
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      llm-server:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../../functions/vector-agent-python:/app

  # 3. Cloudflare Tunnel (zero-trust exposure to Vercel — no public port needed)
  #    Routes: https://jklaw-llm.gen1e.xyz → http://llm-server:12434
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: genie-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - llm-server
    restart: unless-stopped

volumes:
  model-cache:
