packages:
    - apps/*
    - packages/*
onlyBuiltDependencies:
    - "@tailwindcss/oxide"
    - better-sqlite3
    - core-js-pure
    - esbuild
    - msgpackr-extract
    - puppeteer
    - sharp
    - unrs-resolver

# Security overrides for transitive dependencies (pnpm v10+ compatible)
# See: https://github.com/invidias-codem/ai-saas/security/dependabot
overrides:
    esbuild: ">=0.28.1"
    fast-uri: ">=3.1.2"
    fast-xml-builder: ">=1.1.7"
    lodash: ">=4.18.0"
    ajv: ">=8.18.0"
    brace-expansion: ">=5.0.6"
    yaml: ">=2.8.3"
    qs: ">=6.15.2"
    ws: ">=8.20.1"
    ip-address: ">=10.1.1"
    postcss: ">=8.5.10"
