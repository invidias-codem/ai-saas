[project]
name = "lattice-sdk"
version = "0.1.0"
description = "Lattice OS Partner SDK — memory-native AI platform integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lattice OS", email = "team@latticeos.ai" }]
keywords = ["ai", "memory", "context", "agents", "ucol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://latticeos.ai"
Documentation = "https://docs.latticeos.ai/python"
Repository = "https://github.com/invidias-codem/ai-saas"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]
